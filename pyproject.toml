[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "teplayakov_an_mlops_project"
version = "0.0.1"
description = "\u041a\u043b\u0430\u0441\u0441\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u044f \u043a\u0440\u0435\u0434\u0438\u0442\u043d\u043e\u0433\u043e \u0434\u0435\u0444\u043e\u043b\u0442\u0430"
authors = [
  { name = "Alexey Teplayakov" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "black",
    "catboost>=1.2.10",
    "cloudpickle>=3.1.2",
    "fastapi>=0.143.0",
    "flake8",
    "ipython",
    "isort",
    "joblib>=1.6.0",
    "jupyterlab",
    "kagglehub>=1.0.2",
    "loguru",
    "matplotlib",
    "mlflow>=3.17.0",
    "notebook",
    "numpy",
    "pandas",
    "pandera[io,pandas]>=0.34.1",
    "pip",
    "pytest",
    "python-dotenv",
    "scikit-learn",
    "seaborn>=0.13.2",
    "skops>=0.16.0",
    "tqdm",
    "typer",
    "uvicorn>=0.54.0",
]
requires-python = "~=3.13.0"

[tool.flit.module]
name = "src"

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["src"]
force_sort_within_sections = true

[dependency-groups]
dev = [
    "black>=26.10.0",
    "dvc>=3.67.1",
    "flake8>=7.4.1",
    "great-expectations>=1.24.0",
    "httpx>=0.28.1",
    "isort>=9.0.2",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "optuna>=5.0.0",
    "pytest>=9.1.1",
]
